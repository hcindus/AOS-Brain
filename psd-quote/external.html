<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get a Quote — Performance Supply Depot</title>
<style>
  :root { --psd:#1a56db; --bg:#f5f7fa; --card:#fff; --border:#dfe4ec; --text:#1a1f2e; --muted:#6b7488; --green:#1a7f37; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width:560px; margin:40px auto; padding:0 20px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:26px; box-shadow:0 2px 10px rgba(0,0,0,.04); }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:14px; margin-bottom:22px; }
  label { display:block; font-size:12px; color:var(--muted); margin:14px 0 4px; text-transform:uppercase; letter-spacing:.4px; }
  select, input[type=number], input[type=text], input[type=email] { width:100%; padding:11px 12px; border:1px solid var(--border); border-radius:8px; font-size:15px; }
  .chk { display:flex; align-items:center; gap:8px; margin-top:12px; font-size:15px; }
  .chk input { width:auto; }
  button { width:100%; margin-top:20px; padding:14px; background:var(--psd); color:#fff; border:none; border-radius:8px; font-size:16px; font-weight:600; cursor:pointer; }
  button.sec { background:#fff; color:var(--psd); border:1px solid var(--psd); }
  table { width:100%; border-collapse:collapse; font-size:14px; margin-top:16px; }
  th,td { text-align:right; padding:9px 10px; border-bottom:1px solid var(--border); }
  th:first-child, td:first-child { text-align:left; }
  th { color:var(--muted); font-size:11px; text-transform:uppercase; }
  .qty { color:var(--muted); }
  .tot { font-weight:700; font-size:16px; }
  .total-row td { border-top:2px solid var(--text); border-bottom:none; }
  .green { color:var(--green); font-weight:700; }
  .hidden { display:none; }
  .success { background:#e8f7ed; border:1px solid #b7e3c5; color:#1a7f37; padding:14px; border-radius:8px; margin-top:16px; font-size:14px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Get a Free POS Quote</h1>
    <p class="sub">Configure your stations and get an instant price. No obligation.</p>

    <div id="config">
      <label>Number of stations / registers</label>
      <input type="number" id="stations" value="1" min="1">

      <label>Terminal</label>
      <select id="terminal"></select>

      <label>Receipt printer</label>
      <select id="printer"></select>

      <div class="chk"><input type="checkbox" id="drawer" checked> Cash drawer (per station)</div>
      <div class="chk"><input type="checkbox" id="scanner" checked> Barcode scanner (per station)</div>

      <label>Software</label>
      <select id="software"></select>

      <label>Scale (optional add-on)</label>
      <select id="scale"></select>

      <div class="chk"><input type="checkbox" id="delivery" checked> Include delivery ($90)</div>

      <button onclick="buildQuote()">Get My Quote</button>
    </div>

    <div id="result" class="hidden">
      <div id="quoteBody"></div>
      <button class="sec" onclick="reset()">← Back</button>

      <h2 style="font-size:16px; margin-top:24px;">Want to save this quote?</h2>
      <label>Business name</label>
      <input type="text" id="biz">
      <label>Contact name</label>
      <input type="text" id="name">
      <label>Email</label>
      <input type="email" id="email">
      <label>Phone</label>
      <input type="text" id="phone">
      <button onclick="saveQuote()">Send My Quote Request</button>
      <div id="success" class="success hidden">Thanks! We've received your request and will be in touch shortly.</div>
    </div>
  </div>
</div>

<script>
let catalog=null, lastQuote=null, lastSpec=null;

async function loadCatalog(){
  const r = await fetch('/api/catalog');
  catalog = await r.json();
  fill('terminal', catalog.hardware.terminals);
  fill('printer', catalog.hardware.printers);
  fill('software', catalog.software);
  const sc = document.getElementById('scale');
  sc.innerHTML = '<option value="">— None —</option>';
  (catalog.hardware.scales||[]).forEach(i=>{ const o=document.createElement('option'); o.value=i.key; o.textContent=i.name+(i.price!=null?' — $'+i.price:''); sc.appendChild(o); });
}
function fill(id, items){
  const s=document.getElementById(id); s.innerHTML='';
  items.forEach(i=>{ const o=document.createElement('option'); o.value=i.key;
    o.textContent = i.name + (i.price!=null?' — $'+i.price:''); s.appendChild(o); });
}
function fmt(v){ return v==null||v===undefined?'—':'$'+Number(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }

async function buildQuote(){
  lastSpec = {
    stations: parseInt(document.getElementById('stations').value)||1,
    terminal: document.getElementById('terminal').value,
    printer: document.getElementById('printer').value,
    cash_drawer: document.getElementById('drawer').checked,
    scanner: document.getElementById('scanner').checked,
    software: document.getElementById('software').value,
    programming_hours: 0,
    delivery: document.getElementById('delivery').checked,
  };
  const scaleKey = document.getElementById('scale').value;
  if(scaleKey){ lastSpec.add_ons = [{key:scaleKey, qty:1}]; }
  const r = await fetch('/api/quote',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(lastSpec)});
  lastQuote = await r.json();
  const e = lastQuote.external;
  let h = `<table><tr><th>Item</th><th>Qty</th><th>Price</th><th>Total</th></tr>`;
  e.lines.forEach(l=>{ h += `<tr><td>${l.name}</td><td class="qty">×${l.qty}</td><td>${fmt(l.unit_price)}</td><td>${fmt(l.ext_price)}</td></tr>`; });
  h += `<tr><td>Subtotal</td><td></td><td></td><td>${fmt(e.subtotal)}</td></tr>`;
  h += `<tr><td>Tax</td><td></td><td></td><td>${fmt(e.tax)}</td></tr>`;
  h += `<tr class="tot total-row"><td>Total</td><td></td><td></td><td class="green">${fmt(e.total)}</td></tr></table>`;
  if(e.recurring && e.recurring.length){ h += `<p style="color:#6b7488;font-size:13px;">+ ${e.recurring.map(x=>x.name+' @ '+fmt(x.monthly)+'/mo').join(', ')}</p>`; }
  document.getElementById('quoteBody').innerHTML = h;
  document.getElementById('config').classList.add('hidden');
  document.getElementById('result').classList.remove('hidden');
}

function reset(){ document.getElementById('result').classList.add('hidden'); document.getElementById('config').classList.remove('hidden'); }

async function saveQuote(){
  const lead = {
    businessName: document.getElementById('biz').value,
    contactName: document.getElementById('name').value,
    email: document.getElementById('email').value,
    phone: document.getElementById('phone').value,
    destination: 'psd',
    product: 'POS Station Quote ('+lastSpec.stations+'x '+lastSpec.terminal+')',
    notes: JSON.stringify({spec:lastSpec, total:lastQuote.external.total}),
  };
  // Save to quote engine AND forward to lead portal
  try { await fetch('/api/quote/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer:{businessName:lead.businessName,contactName:lead.contactName,email:lead.email,phone:lead.phone},spec:lastSpec,internal:lastQuote.internal,external:lastQuote.external})}); } catch(e){}
  try { await fetch('http://127.0.0.1:8086/api/leads',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(lead)}); } catch(e){}
  document.getElementById('success').classList.remove('hidden');
}

loadCatalog();
</script>
</body>
</html>
