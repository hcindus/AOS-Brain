# OrderPort — online ordering portal
# Drops storefront/merchant/admin under psdepot.com, proxying to the FastAPI app on 8088.
#
# URL map:
#   /order/{slug}       -> storefront (public)
#   /portal/...         -> merchant portal
#   /admin-portal/...   -> admin portal
#   /api/orderport/...  -> backend API

server {
    listen 80;
    server_name psdepot.com;

    # Backend API
    location /api/orderport/ {
        proxy_pass http://127.0.0.1:8088/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Storefront
    location /order/ {
        proxy_pass http://127.0.0.1:8088/s/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Merchant portal
    location /portal/ {
        proxy_pass http://127.0.0.1:8088/m/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Admin portal
    location /admin-portal/ {
        proxy_pass http://127.0.0.1:8088/a/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
