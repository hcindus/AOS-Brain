<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RS-80 POS - Pollos Asados El Trebol</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
        }
        
        .header {
            background: linear-gradient(135deg, #d32f2f 0%, #b71c1c 100%);
            color: white;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }
        
        .header .subtitle {
            font-size: 14px;
            opacity: 0.9;
            margin-top: 4px;
        }
        
        .container {
            display: flex;
            max-width: 1400px;
            margin: 0 auto;
            gap: 20px;
            padding: 20px;
        }
        
        .menu-section {
            flex: 1;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            overflow: hidden;
        }
        
        .category-tabs {
            display: flex;
            background: #fafafa;
            border-bottom: 1px solid #e0e0e0;
            overflow-x: auto;
        }
        
        .category-tab {
            padding: 16px 24px;
            cursor: pointer;
            border: none;
            background: transparent;
            font-size: 14px;
            font-weight: 500;
            color: #666;
            white-space: nowrap;
            transition: all 0.2s;
        }
        
        .category-tab:hover {
            color: #d32f2f;
            background: rgba(211, 47, 47, 0.05);
        }
        
        .category-tab.active {
            color: #d32f2f;
            border-bottom: 3px solid #d32f2f;
            background: white;
        }
        
        .menu-items {
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }
        
        .menu-item {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        
        .menu-item:hover {
            border-color: #d32f2f;
            box-shadow: 0 4px 12px rgba(211, 47, 47, 0.15);
            transform: translateY(-2px);
        }
        
        .menu-item .name {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }
        
        .menu-item .description {
            font-size: 13px;
            color: #666;
            margin-bottom: 12px;
            line-height: 1.4;
        }
        
        .menu-item .price {
            font-size: 20px;
            font-weight: 700;
            color: #d32f2f;
        }
        
        .menu-item .add-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #d32f2f;
            color: white;
            border: none;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        
        .menu-item .add-btn:hover {
            background: #b71c1c;
            transform: scale(1.1);
        }
        
        .cart-section {
            width: 380px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            max-height: calc(100vh - 140px);
            position: sticky;
            top: 20px;
        }
        
        .cart-header {
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
            background: #fafafa;
            border-radius: 12px 12px 0 0;
        }
        
        .cart-header h2 {
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }
        
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .cart-item:last-child {
            border-bottom: none;
        }
        
        .cart-item-info {
            flex: 1;
        }
        
        .cart-item-name {
            font-weight: 500;
            font-size: 14px;
        }
        
        .cart-item-price {
            font-size: 13px;
            color: #666;
        }
        
        .cart-item-qty {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .qty-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 1px solid #ddd;
            background: white;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .qty-btn:hover {
            background: #f5f5f5;
        }
        
        .qty-value {
            font-weight: 600;
            min-width: 24px;
            text-align: center;
        }
        
        .cart-footer {
            padding: 20px;
            border-top: 1px solid #e0e0e0;
            background: #fafafa;
            border-radius: 0 0 12px 12px;
        }
        
        .cart-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        
        .cart-total-label {
            font-size: 16px;
            font-weight: 500;
        }
        
        .cart-total-value {
            font-size: 24px;
            font-weight: 700;
            color: #d32f2f;
        }
        
        .cart-breakdown {
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px dashed #ddd;
        }
        
        .breakdown-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .breakdown-row.subtotal {
            color: #666;
        }
        
        .breakdown-row.tax {
            color: #666;
            font-size: 13px;
        }
        
        .breakdown-row.tax-rate {
            font-size: 11px;
            color: #999;
            margin-top: -4px;
            margin-bottom: 8px;
        }
        
        .breakdown-row.total {
            font-weight: 600;
            font-size: 16px;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #e0e0e0;
        }
        
        .checkout-btn {
            width: 100%;
            padding: 16px;
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .checkout-btn:hover {
            background: #45a049;
        }
        
        .checkout-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .empty-cart {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }
        
        .empty-cart-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        
        .badge {
            display: inline-block;
            padding: 4px 8px;
            background: #ffebee;
            color: #d32f2f;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .demo-banner {
            background: #2196f3;
            color: white;
            text-align: center;
            padding: 8px;
            font-size: 12px;
            font-weight: 500;
        }
        
        @media (max-width: 1024px) {
            .container {
                flex-direction: column;
            }
            
            .cart-section {
                width: 100%;
                max-height: none;
                position: static;
            }
        }
    </style>
</head>
<body>
    <div class="demo-banner">
        RS-80 POS System Demo — Pollos Asados El Trebol
    </div>
    
    <div class="header">
        <h1>🍗 Pollos Asados El Trebol</h1>
        <div class="subtitle">1005 S White Rd, San Jose, CA 95127 | (669) 214-0760</div>
    </div>
    
    <div class="container">
        <div class="menu-section">
            <div class="category-tabs">
                <button class="category-tab active" onclick="showCategory('pollo')">Pollo Asado</button>
                <button class="category-tab" onclick="showCategory('combos')">Combos</button>
                <button class="category-tab" onclick="showCategory('sides')">Sides</button>
                <button class="category-tab" onclick="showCategory('bebidas')">Bebidas</button>
                <button class="category-tab" onclick="showCategory('extras')">Extras</button>
            </div>
            
            <div class="menu-items" id="menu-items">
                <!-- Items populated by JavaScript -->
            </div>
        </div>
        
        <div class="cart-section">
            <div class="cart-header">
                <h2>🛒 Order <span class="badge" id="item-count">0 items</span></h2>
            </div>
            
            <div class="cart-items" id="cart-items">
                <div class="empty-cart">
                    <div class="empty-cart-icon">🛒</div>
                    <p>Your cart is empty</p>
                    <p style="font-size: 13px; margin-top: 8px;">Tap items to add them</p>
                </div>
            </div>
            
            <div class="cart-footer">
                <div class="cart-breakdown" id="cart-breakdown">
                    <div class="breakdown-row subtotal">
                        <span>Subtotal</span>
                        <span id="subtotal">$0.00</span>
                    </div>
                    <div class="breakdown-row tax">
                        <span>Tax (9.125%)</span>
                        <span id="tax">$0.00</span>
                    </div>
                    <div class="breakdown-row tax-rate">San Jose, CA Sales Tax</div>
                </div>
                <div class="cart-total">
                    <span class="cart-total-label">Total</span>
                    <span class="cart-total-value" id="cart-total">$0.00</span>
                </div>
                <button class="checkout-btn" id="checkout-btn" disabled onclick="checkout()">
                    Proceed to Payment
                </button>
            </div>
        </div>
    </div>
    
    <script>
        const menuData = {
            pollo: [
                { id: 1, name: "Pollo Entero Asado", description: "Whole roasted chicken, seasoned with our signature blend", price: 24.88 },
                { id: 2, name: "Pollo Entero con Tortilla y Salsa", description: "Whole chicken with fresh tortillas and house salsa", price: 25.00 },
                { id: 3, name: "Medio Pollo Asado", description: "Half chicken, perfect for smaller appetites", price: 14.50 },
                { id: 4, name: "Pollo Desmenuzado (1 lb)", description: "Shredded chicken by the pound", price: 18.00 },
                { id: 5, name: "Pechuga de Pollo Asada", description: "Grilled chicken breast", price: 12.00 },
                { id: 6, name: "Pierna y Muslo", description: "Leg and thigh quarter", price: 9.50 }
            ],
            combos: [
                { id: 10, name: "Combo #1", description: "Pollo Entero + 2 Sides (rice, beans, salad, or fries)", price: 32.00 },
                { id: 11, name: "Combo #2", description: "Pollo Entero + 3 Sides", price: 36.00 },
                { id: 12, name: "Combo Familiar", description: "2 Pollos Enteros + 4 Sides + 2L Soda", price: 65.00 },
                { id: 13, name: "Combo Individual", description: "1/2 Pollo + 1 Side + Drink", price: 18.50 },
                { id: 14, name: "Combo Pareja", description: "2 1/2 Pollos + 2 Sides + 2 Drinks", price: 34.00 }
            ],
            sides: [
                { id: 20, name: "Arroz Mexicano", description: "Mexican rice with vegetables", price: 4.50 },
                { id: 21, name: "Frijoles Refritos", description: "Refried beans with cheese", price: 4.50 },
                { id: 22, name: "Ensalada Fresca", description: "Fresh salad with house dressing", price: 4.00 },
                { id: 23, name: "Papas Fritas", description: "French fries", price: 4.50 },
                { id: 24, name: "Tortillas (4)", description: "Fresh corn tortillas", price: 2.50 },
                { id: 25, name: "Tortillas (12)", description: "Fresh corn tortillas", price: 5.00 },
                { id: 26, name: "Chips & Salsa", description: "Tortilla chips with salsa", price: 4.50 },
                { id: 27, name: "Guacamole", description: "Fresh made guacamole", price: 5.50 },
                { id: 28, name: "Queso Fundido", description: "Melted cheese with peppers", price: 6.00 }
            ],
            bebidas: [
                { id: 30, name: "Sidral Mundet", description: "Apple soda", price: 6.15 },
                { id: 31, name: "Mineagua", description: "Flavored water", price: 6.15 },
                { id: 32, name: "Coca Cola 500ml", description: "Bottle", price: 7.20 },
                { id: 33, name: "Soda Lata", description: "Can soda", price: 5.10 },
                { id: 34, name: "Soda Botella", description: "Bottle soda", price: 6.15 },
                { id: 35, name: "Agua Fresca", description: "Horchata, Jamaica, or Melon", price: 5.50 },
                { id: 36, name: "Agua Embotellada", description: "Bottled water", price: 3.00 },
                { id: 37, name: "Jarrito", description: "Mexican soda", price: 4.50 }
            ],
            extras: [
                { id: 40, name: "Salsa Verde (8oz)", description: "Green salsa", price: 3.50 },
                { id: 41, name: "Salsa Roja (8oz)", description: "Red salsa", price: 3.50 },
                { id: 42, name: "Crema", description: "Mexican sour cream", price: 2.00 },
                { id: 43, name: "Queso", description: "Cheese topping", price: 2.00 },
                { id: 44, name: "Cebolla Asada", description: "Grilled onions", price: 2.50 },
                { id: 45, name: "Chiles Toreados", description: "Grilled jalapeños", price: 2.50 }
            ]
        };
        
        let cart = [];
        let currentCategory = 'pollo';
        
        function showCategory(category) {
            currentCategory = category;
            
            // Update tabs
            document.querySelectorAll('.category-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // Render items
            renderMenuItems(category);
        }
        
        function renderMenuItems(category) {
            const container = document.getElementById('menu-items');
            const items = menuData[category];
            
            container.innerHTML = items.map(item => `
                <div class="menu-item" onclick="addToCart(${item.id}, '${category}')">
                    <div class="name">${item.name}</div>
                    <div class="description">${item.description}</div>
                    <div class="price">$${item.price.toFixed(2)}</div>
                    <button class="add-btn">+</button>
                </div>
            `).join('');
        }
        
        function addToCart(itemId, category) {
            const item = menuData[category].find(i => i.id === itemId);
            const existingItem = cart.find(i => i.id === itemId);
            
            if (existingItem) {
                existingItem.quantity++;
            } else {
                cart.push({ ...item, quantity: 1 });
            }
            
            renderCart();
        }
        
        function updateQuantity(itemId, change) {
            const item = cart.find(i => i.id === itemId);
            if (item) {
                item.quantity += change;
                if (item.quantity <= 0) {
                    cart = cart.filter(i => i.id !== itemId);
                }
            }
            renderCart();
        }
        
        // San Jose, CA sales tax rate (9.125%)
        const TAX_RATE = 0.09125;
        
        function renderCart() {
            const cartItems = document.getElementById('cart-items');
            const cartTotal = document.getElementById('cart-total');
            const itemCount = document.getElementById('item-count');
            const checkoutBtn = document.getElementById('checkout-btn');
            const subtotalEl = document.getElementById('subtotal');
            const taxEl = document.getElementById('tax');
            const breakdownEl = document.getElementById('cart-breakdown');
            
            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const tax = subtotal * TAX_RATE;
            const total = subtotal + tax;
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            
            if (cart.length === 0) {
                cartItems.innerHTML = `
                    <div class="empty-cart">
                        <div class="empty-cart-icon">🛒</div>
                        <p>Your cart is empty</p>
                        <p style="font-size: 13px; margin-top: 8px;">Tap items to add them</p>
                    </div>
                `;
                breakdownEl.style.display = 'none';
                checkoutBtn.disabled = true;
            } else {
                cartItems.innerHTML = cart.map(item => `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <div class="cart-item-name">${item.name}</div>
                            <div class="cart-item-price">$${item.price.toFixed(2)}</div>
                        </div>
                        <div class="cart-item-qty">
                            <button class="qty-btn" onclick="updateQuantity(${item.id}, -1)">−</button>
                            <span class="qty-value">${item.quantity}</span>
                            <button class="qty-btn" onclick="updateQuantity(${item.id}, 1)">+</button>
                        </div>
                    </div>
                `).join('');
                breakdownEl.style.display = 'block';
                checkoutBtn.disabled = false;
            }
            
            subtotalEl.textContent = `$${subtotal.toFixed(2)}`;
            taxEl.textContent = `$${tax.toFixed(2)}`;
            cartTotal.textContent = `$${total.toFixed(2)}`;
            itemCount.textContent = `${totalItems} item${totalItems !== 1 ? 's' : ''}`;
        }
        
        function checkout() {
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            alert(`Demo: Order submitted!\n\nTotal: $${total.toFixed(2)}\n\nIn production, this would connect to:\n• Payment processor\n• Kitchen display\n• Receipt printer\n• Order management system`);
        }
        
        // Initialize
        renderMenuItems('pollo');
    </script>
</body>
</html>
