# RS-79 POS System - Docker Compose Production Stack
# Usage: docker-compose -f docker-compose.yml up -d

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: rs79-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rs79}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme-strong-password}
      POSTGRES_DB: ${POSTGRES_DB:-rs79}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - rs79-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rs79}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RS-79 POS Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: rs79-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-rs79}:${POSTGRES_PASSWORD:-changeme-strong-password}@postgres:5432/${POSTGRES_DB:-rs79}?schema=public
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-your-super-secret-key-change-in-production}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret-change-in-production}
      # Optional: Configure for external access
      PORT: 3000
      HOSTNAME: "0.0.0.0"
    volumes:
      - ./prisma/migrations:/app/prisma/migrations:ro
      - uploads:/app/public/uploads
    networks:
      - rs79-network
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Redis for session caching (uncomment if needed)
  # redis:
  #   image: redis:7-alpine
  #   container_name: rs79-redis
  #   restart: unless-stopped
  #   volumes:
  #     - redis_data:/data
  #   networks:
  #     - rs79-network

  # Optional: Nginx reverse proxy (uncomment if not using external nginx)
  # nginx:
  #   image: nginx:alpine
  #   container_name: rs79-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./nginx/ssl:/etc/nginx/ssl:ro
  #     - nginx_logs:/var/log/nginx
  #   networks:
  #     - rs79-network
  #   depends_on:
  #     - app

volumes:
  postgres_data:
    driver: local
  uploads:
    driver: local
  # redis_data:
  #   driver: local
  # nginx_logs:
  #   driver: local

networks:
  rs79-network:
    driver: bridge