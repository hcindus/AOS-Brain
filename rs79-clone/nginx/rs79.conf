# RS-79 POS System - Nginx Reverse Proxy Configuration
# Install: sudo cp rs79.conf /etc/nginx/sites-available/rs79
# Enable: sudo ln -s /etc/nginx/sites-available/rs79 /etc/nginx/sites-enabled/
# Test: sudo nginx -t
# Reload: sudo systemctl reload nginx

# Upstream for the RS-79 application
upstream rs79_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=rs79_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=rs79_api:10m rate=100r/m;

# Server block for HTTP (redirect to HTTPS)
server {
    listen 80;
    listen [::]:80;
    server_name pos.yourdomain.com;

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# Server block for HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pos.yourdomain.com;

    # SSL Certificates (Let's Encrypt or custom)
    ssl_certificate /etc/letsencrypt/live/pos.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pos.yourdomain.com/privkey.pem;

    # SSL Security settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' ws: wss:; frame-ancestors 'none';" always;

    # Logging
    access_log /var/log/nginx/rs79-access.log;
    error_log /var/log/nginx/rs79-error.log;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Static files (bypass proxy for Next.js static assets)
    location /_next/static/ {
        alias /opt/rs79/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /static/ {
        alias /opt/rs79/public/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API rate limiting
    location /api/auth/ {
        limit_req zone=rs79_login burst=5 nodelay;
        proxy_pass http://rs79_backend;
        include /etc/nginx/proxy_params;
    }

    location /api/ {
        limit_req zone=rs79_api burst=20 nodelay;
        proxy_pass http://rs79_backend;
        include /etc/nginx/proxy_params;
    }

    # WebSocket support (if needed for real-time features)
    location /ws/ {
        proxy_pass http://rs79_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        include /etc/nginx/proxy_params;
    }

    # Main application
    location / {
        proxy_pass http://rs79_backend;
        include /etc/nginx/proxy_params;
    }
}

# Optional: Nginx proxy params file content (place in /etc/nginx/proxy_params)
