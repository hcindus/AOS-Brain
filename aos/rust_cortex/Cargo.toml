[package]
name = "aos_cortex"
version = "0.1.0"
edition = "2021"

[lib]
name = "aos_cortex"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module"] }
rayon = "1.8"
numpy = "0.20"
ndarray = { version = "0.15", features = ["rayon"] }
simd-rs = "0.1"

[features]
default = ["simd"]
simd = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true