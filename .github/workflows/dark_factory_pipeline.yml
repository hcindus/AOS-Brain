name: Dark Factory Pipeline Monitor

on:
  schedule:
    # Run every hour
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  monitor-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Run Pipeline Check
        run: |
          python3 AGI_COMPANY/subsidiaries/DARK_FACTORY/pipeline/dark_factory_pipeline.py report
      
      - name: Update Metrics Badge
        run: |
          # Create/update status badge
          mkdir -p .github/badges
          echo "Dark Factory Active" > .github/badges/dark_factory_status.txt
      
      - name: Commit Status Update
        run: |
          git config user.name "Dark Factory Bot"
          git config user.email "factory@agi.company"
          git add -A
          git commit -m "Pipeline status update $(date -u +%Y-%m-%d_%H:%M)" || true
          git push
