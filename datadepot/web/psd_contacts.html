<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacts - Performance Supply Depot</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="psd-shell.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            min-height: 100vh;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 30px; }
        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 20px;
        }
        .card h3 {
            color: #e94560;
            margin-bottom: 20px;
            font-size: 18px;
        }
        .priority-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .priority-card {
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid;
        }
        .priority-high {
            background: rgba(248, 113, 113, 0.1);
            border-color: #f87171;
        }
        .priority-medium {
            background: rgba(251, 191, 36, 0.1);
            border-color: #fbbf24;
        }
        .priority-low {
            background: rgba(74, 222, 128, 0.1);
            border-color: #4ade80;
        }
        .contact-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .contact-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .contact-item:hover {
            background: rgba(233, 69, 96, 0.1);
        }
        .contact-info h4 {
            margin: 0 0 5px 0;
            color: #fff;
        }
        .contact-info p {
            margin: 0;
            font-size: 13px;
            color: #a0a0a0;
        }
        .contact-actions {
            display: flex;
            gap: 10px;
        }
        .btn {
            padding: 8px 16px;
            background: #e94560;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }
        .btn-secondary {
            background: rgba(15, 52, 96, 0.6);
        }
        .btn:hover { opacity: 0.9; }
        .tier-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
            margin-left: 10px;
        }
        .tier-stone { background: linear-gradient(135deg, #A0826D, #8B7355); color: #fff; }
        .tier-bronze { background: linear-gradient(135deg, #E69138, #CD7F32); color: #1a1a2e; }
        .tier-silver { background: linear-gradient(135deg, #E8E8E8, #C0C0C0); color: #1a1a2e; }
        .tier-gold { background: linear-gradient(135deg, #FFD700, #FFAA00); color: #1a1a2e; }
        .tier-platinum { background: linear-gradient(135deg, #F5F5F5, #E5E4E2); color: #1a1a2e; }
        .tier-diamond { background: linear-gradient(135deg, #E0FFFF, #B9F2FF); color: #1a1a2e; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: linear-gradient(135deg, rgba(233, 69, 96, 0.2) 0%, rgba(15, 52, 96, 0.4) 100%);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
        .stat-card .value {
            font-size: 28px;
            font-weight: bold;
            color: #fff;
        }
        .stat-card .label {
            font-size: 12px;
            color: #a0a0a0;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="value" id="totalDue">-</div>
                <div class="label">Contacts Due</div>
            </div>
            <div class="stat-card">
                <div class="value" id="highPriority">-</div>
                <div class="label">High Priority</div>
            </div>
            <div class="stat-card">
                <div class="value" id="mediumPriority">-</div>
                <div class="label">Medium Priority</div>
            </div>
            <div class="stat-card">
                <div class="value" id="contactedToday">0</div>
                <div class="label">Contacted Today</div>
            </div>
        </div>

        <div class="card">
            <h3>🔴 High Priority (Overdue)</h3>
            <div class="contact-list" id="highPriorityList">
                <div style="text-align: center; padding: 40px; color: #a0a0a0;">Loading contacts...</div>
            </div>
        </div>

        <div class="card">
            <h3>🟡 Medium Priority (Due Soon)</h3>
            <div class="contact-list" id="mediumPriorityList">
                <div style="text-align: center; padding: 40px; color: #a0a0a0;">Loading contacts...</div>
            </div>
        </div>

        <div class="card">
            <h3>🟢 Recently Contacted</h3>
            <div class="contact-list" id="recentlyContacted">
                <div style="text-align: center; padding: 40px; color: #a0a0a0;">Loading...</div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.hostname === 'localhost' 
            ? 'http://localhost:8081' 
            : (window.location.hostname.includes('psdepot.com') ? '/psd-api' : '');

        const TIER_MAP = {
            'PPCL': 'bronze',
            'Prime': 'silver',
            'Spot On Target': 'gold',
            'Top 165': 'platinum'
        };

        async function fetchAPI(endpoint) {
            const response = await fetch(`${API_BASE}${endpoint}`);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return await response.json();
        }

        function getTierClass(category) {
            return 'tier-' + (TIER_MAP[category] || 'stone');
        }

        function escapeHtml(text) {
            if (!text) return '-';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function loadContacts() {
            try {
                // Get all customers and filter by last_contact
                const data = await fetchAPI('/customers?limit=500');
                let customers = data.customers || [];
                
                // Filter out summary rows
                customers = customers.filter(c => 
                    c.business_name && 
                    !c.business_name.includes('RUNNING TOTAL') &&
                    !c.business_name.includes('***')
                );
                
                const now = new Date();
                const thirtyDaysAgo = new Date(now - 30 * 24 * 60 * 60 * 1000);
                const sixtyDaysAgo = new Date(now - 60 * 24 * 60 * 60 * 1000);
                
                // Categorize by priority
                const highPriority = customers.filter(c => {
                    if (!c.last_contact) return true;
                    return new Date(c.last_contact) < sixtyDaysAgo;
                });
                
                const mediumPriority = customers.filter(c => {
                    if (!c.last_contact) return false;
                    const lastContact = new Date(c.last_contact);
                    return lastContact >= sixtyDaysAgo && lastContact < thirtyDaysAgo;
                });
                
                const recentlyContacted = customers.filter(c => {
                    if (!c.last_contact) return false;
                    return new Date(c.last_contact) >= thirtyDaysAgo;
                }).slice(0, 10);
                
                // Update stats
                document.getElementById('totalDue').textContent = highPriority.length + mediumPriority.length;
                document.getElementById('highPriority').textContent = highPriority.length;
                document.getElementById('mediumPriority').textContent = mediumPriority.length;
                
                // Render lists
                renderContactList('highPriorityList', highPriority.slice(0, 20));
                renderContactList('mediumPriorityList', mediumPriority.slice(0, 20));
                renderContactList('recentlyContacted', recentlyContacted);
                
            } catch (e) {
                console.error('Error loading contacts:', e);
                document.getElementById('highPriorityList').innerHTML = `<div style="text-align: center; padding: 40px; color: #f87171;">Error: ${e.message}</div>`;
            }
        }

        function renderContactList(elementId, contacts) {
            const container = document.getElementById(elementId);
            
            if (contacts.length === 0) {
                container.innerHTML = `<div style="text-align: center; padding: 40px; color: #a0a0a0;">No contacts in this category</div>`;
                return;
            }
            
            container.innerHTML = contacts.map(c => {
                const lastContact = c.last_contact 
                    ? new Date(c.last_contact).toLocaleDateString() 
                    : 'Never';
                
                return `
                    <div class="contact-item">
                        <div class="contact-info">
                            <h4>${escapeHtml(c.business_name)} <span class="tier-badge ${getTierClass(c.category)}">${c.category || 'Stone'}</span></h4>
                            <p>📞 ${escapeHtml(c.phone || 'No phone')} | 📍 ${escapeHtml(c.city || 'Unknown')}, ${escapeHtml(c.state || '')} | Last contact: ${lastContact}</p>
                        </div>
                        <div class="contact-actions">
                            <a href="psd_customer.html?id=${c.id}" class="btn btn-secondary">View</a>
                            <button class="btn" onclick="recordContact(${c.id})">✓ Log Contact</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function recordContact(customerId) {
            try {
                const response = await fetch(`${API_BASE}/customers/${customerId}/contact`, {
                    method: 'POST'
                });
                
                if (response.ok) {
                    alert('✅ Contact recorded successfully!');
                    loadContacts(); // Refresh
                } else {
                    alert('❌ Failed to record contact');
                }
            } catch (e) {
                alert('❌ Error: ' + e.message);
            }
        }

        document.addEventListener('DOMContentLoaded', loadContacts);
    </script>
</body>
</html>
