<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mortimer - Constellation Face</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #000011; 
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        #canvas-container { 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%;
        }
        #status {
            position: fixed;
            bottom: 20px;
            left: 20px;
            color: #88ccff;
            font-size: 12px;
            opacity: 0.7;
            pointer-events: none;
        }
        #expression {
            position: fixed;
            bottom: 20px;
            right: 20px;
            color: #ffaa44;
            font-size: 14px;
            opacity: 0.9;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="status">Connecting to brain...</div>
    <div id="expression">Neutral</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // State
        const state = {
            mode: 'Analytical',
            speaking: false,
            listening: false,
            expression: 'Neutral',
            brainPulse: 0
        };

        // Scene setup
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000011, 0.02);
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 8);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Lights
        const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
        scene.add(ambientLight);
        
        const faceLight = new THREE.PointLight(0x88ccff, 1, 100);
        faceLight.position.set(0, 0, 5);
        scene.add(faceLight);

        // Face group
        const faceGroup = new THREE.Group();
        scene.add(faceGroup);

        // Star geometry
        const starGeometry = new THREE.BufferGeometry();
        const starPositions = [];
        const starColors = [];
        const starSizes = [];
        const starTwinkle = [];
        
        // Define face constellation points (x, y, z)
        // Forehead
        const points = [
            // Forehead arc
            [-2, 2.5, 0], [-1.5, 3, 0], [-0.5, 3.2, 0], [0.5, 3.2, 0], [1.5, 3, 0], [2, 2.5, 0],
            // Brows
            [-1.8, 1.8, 0.1], [-1, 1.9, 0.15], [0, 1.85, 0.15], [1, 1.9, 0.15], [1.8, 1.8, 0.1],
            // Eyes (each eye has 5 points)
            [-1.5, 1, 0.2], [-1.2, 1.1, 0.25], [-0.9, 1, 0.25], [-1.2, 0.9, 0.25], [-1.2, 1, 0.3], // Left eye
            [1.5, 1, 0.2], [1.2, 1.1, 0.25], [0.9, 1, 0.25], [1.2, 0.9, 0.25], [1.2, 1, 0.3],   // Right eye
            // Nose bridge
            [-0.3, 0.5, 0.3], [0, 0.8, 0.35], [0.3, 0.5, 0.3],
            [0, 0.3, 0.4], [0, 0, 0.45], [0, -0.3, 0.4], // Nose tip
            // Mouth
            [-1.2, -1.2, 0.2], [-0.8, -1.4, 0.25], [-0.4, -1.5, 0.3], 
            [0, -1.5, 0.35], [0.4, -1.5, 0.3], [0.8, -1.4, 0.25], [1.2, -1.2, 0.2],
            // Jawline
            [-2.2, -0.5, 0], [-2.4, -1.5, -0.1], [-2, -2.5, -0.2], [-1, -3.2, -0.3],
            [0, -3.5, -0.3], [1, -3.2, -0.3], [2, -2.5, -0.2], [2.4, -1.5, -0.1], [2.2, -0.5, 0],
            // Cheeks
            [-2.5, 0.5, -0.1], [-2.6, 0, -0.2], [-2.5, -0.8, -0.2],
            [2.5, 0.5, -0.1], [2.6, 0, -0.2], [2.5, -0.8, -0.2],
            // Ears
            [-2.8, 0, -0.3], [-3, 0.5, -0.4], [-3, -0.5, -0.4],
            [2.8, 0, -0.3], [3, 0.5, -0.4], [3, -0.5, -0.4],
            // Background halo
            ...Array.from({length: 50}, () => [
                (Math.random() - 0.5) * 10,
                (Math.random() - 0.5) * 10,
                (Math.random() - 0.5) * 5 - 2
            ]).flat()
        ];

        // Color palette
        const colors = {
            neutral: [0.5, 0.8, 1.0],
            thinking: [0.3, 0.6, 1.0],
            speaking: [1.0, 0.7, 0.4],
            listening: [0.4, 1.0, 0.6],
            curious: [0.8, 0.4, 1.0],
            happy: [1.0, 0.8, 0.3]
        };

        let currentColor = colors.neutral;

        // Build star positions
        points.forEach((p, i) => {
            starPositions.push(...p);
            // Face stars vs background stars
            if (i < points.length - 50) {
                starColors.push(...colors.neutral);
                starSizes.push(Math.random() * 0.1 + 0.05);
            } else {
                starColors.push(0.3, 0.3, 0.4); // dim background
                starSizes.push(Math.random() * 0.03 + 0.02);
            }
            starTwinkle.push(Math.random() * Math.PI * 2);
        });

        starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starPositions, 3));
        starGeometry.setAttribute('color', new THREE.Float32BufferAttribute(starColors, 3));
        starGeometry.setAttribute('size', new THREE.Float32BufferAttribute(starSizes, 1));

        // Star material
        const starMaterial = new THREE.PointsMaterial({
            size: 0.1,
            vertexColors: true,
            transparent: true,
            opacity: 0.9,
            sizeAttenuation: true,
            blending: THREE.AdditiveBlending
        });

        const stars = new THREE.Points(starGeometry, starMaterial);
        faceGroup.add(stars);

        // Connection lines (constellation effect)
        const lineMaterial = new THREE.LineBasicMaterial({ 
            color: 0x4488aa, 
            transparent: true, 
            opacity: 0.15,
            blending: THREE.AdditiveBlending
        });
        
        // Connect nearby face points
        const linePositions = [];
        const facePointCount = points.length - 50;
        for (let i = 0; i < facePointCount; i++) {
            for (let j = i + 1; j < facePointCount; j++) {
                const p1 = points[i];
                const p2 = points[j];
                const dist = Math.sqrt(
                    Math.pow(p1[0] - p2[0], 2) + 
                    Math.pow(p1[1] - p2[1], 2) + 
                    Math.pow(p1[2] - p2[2], 2)
                );
                // Connect if close enough
                if (dist < 1.2) {
                    linePositions.push(...p1, ...p2);
                }
            }
        }
        
        const lineGeometry = new THREE.BufferGeometry();
        lineGeometry.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
        const constellation = new THREE.LineSegments(lineGeometry, lineMaterial);
        faceGroup.add(constellation);

        // Halo effect
        const haloGeometry = new THREE.SphereGeometry(4, 32, 32);
        const haloMaterial = new THREE.MeshBasicMaterial({
            color: 0x224466,
            transparent: true,
            opacity: 0.05,
            side: THREE.BackSide,
            blending: THREE.AdditiveBlending
        });
        const halo = new THREE.Mesh(haloGeometry, haloMaterial);
        faceGroup.add(halo);

        // Animation
        let time = 0;
        
        function updateColors(targetColor) {
            const colorAttr = starGeometry.attributes.color;
            const facePointCount = points.length - 50;
            
            for (let i = 0; i < facePointCount; i++) {
                const current = [
                    colorAttr.getX(i),
                    colorAttr.getY(i),
                    colorAttr.getZ(i)
                ];
                // Lerp towards target
                const newColor = [
                    current[0] + (targetColor[0] - current[0]) * 0.05,
                    current[1] + (targetColor[1] - current[1]) * 0.05,
                    current[2] + (targetColor[2] - current[2]) * 0.05
                ];
                colorAttr.setXYZ(i, ...newColor);
            }
            colorAttr.needsUpdate = true;
        }

        function animate() {
            requestAnimationFrame(animate);
            time += 0.016;

            // Gentle rotation
            faceGroup.rotation.y = Math.sin(time * 0.1) * 0.15;
            faceGroup.rotation.x = Math.sin(time * 0.05) * 0.05;

            // Twinkle effect
            const sizeAttr = starGeometry.attributes.size;
            for (let i = 0; i < starTwinkle.length; i++) {
                const twinkle = Math.sin(time * 2 + starTwinkle[i]) * 0.02;
                const baseSize = starSizes[i];
                sizeAttr.setX(i, Math.max(0.01, baseSize + twinkle));
            }
            sizeAttr.needsUpdate = true;

            // Pulse halo with brain state
            const pulse = 1 + Math.sin(time * 1.5 + state.brainPulse) * 0.1;
            if (state.speaking) {
                halo.scale.setScalar(pulse * 1.2);
                haloMaterial.opacity = 0.08 + Math.sin(time * 8) * 0.03;
            } else if (state.listening) {
                halo.scale.setScalar(1.1);
                haloMaterial.opacity = 0.1;
            } else {
                halo.scale.setScalar(1);
                haloMaterial.opacity = 0.03 + Math.sin(time) * 0.01;
            }

            // Update colors based on state
            let targetColor = colors.neutral;
            if (state.speaking) targetColor = colors.speaking;
            else if (state.listening) targetColor = colors.listening;
            else if (state.mode === 'Analytical') targetColor = colors.thinking;
            else if (state.mode === 'Creative') targetColor = colors.curious;
            else if (state.expression === 'Happy') targetColor = colors.happy;
            
            updateColors(targetColor);

            // Face light follows mode
            faceLight.color.setRGB(...targetColor);
            faceLight.intensity = state.speaking ? 2 : (state.listening ? 1.5 : 1);

            renderer.render(scene, camera);
        }

        animate();

        // Brain API connection
        async function updateBrainState() {
            try {
                const response = await fetch('http://127.0.0.1:5001/status');
                const data = await response.json();
                
                state.mode = data.brain?.mode || 'Analytical';
                state.brainPulse = data.brain?.tick_count || 0;
                
                document.getElementById('status').textContent = 
                    `Mode: ${state.mode} | Pulse: ${state.brainPulse}`;
            } catch (e) {
                document.getElementById('status').textContent = 'Brain offline';
            }
        }

        // Update brain state every 2 seconds
        setInterval(updateBrainState, 2000);
        updateBrainState();

        // Hooks for TTS/STT
        window.onSpeechStart = () => {
            state.speaking = true;
            document.getElementById('expression').textContent = 'Speaking...';
        };
        
        window.onSpeechEnd = () => {
            state.speaking = false;
            document.getElementById('expression').textContent = state.mode;
        };
        
        window.onListeningStart = () => {
            state.listening = true;
            document.getElementById('expression').textContent = 'Listening...';
        };
        
        window.onListeningEnd = () => {
            state.listening = false;
            document.getElementById('expression').textContent = state.mode;
        };

        // Resize handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Initial expression
        document.getElementById('expression').textContent = 'Mortimer - Awake';
    </script>
</body>
</html>
