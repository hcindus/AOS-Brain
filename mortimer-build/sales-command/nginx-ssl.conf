worker_processes 1;
daemon off;

events {
    worker_connections 1024;
}

http {
    include /data/data/com.termux/files/usr/etc/nginx/mime.types;
    default_type application/octet-stream;
    
    server {
        listen 3333;
        server_name _;
        
        root /var/www/commandcenter;
        index index.html;
        
        location / {
            try_files $uri $uri/ =404;
        }
    }
    
    server {
        listen 3443 ssl;
        server_name _;
        
        ssl_certificate /var/www/commandcenter/cert.pem;
        ssl_certificate_key /var/www/commandcenter/key.pem;
        
        root /var/www/commandcenter;
        index index.html;
        
        location / {
            try_files $uri $uri/ =404;
        }
    }
}
