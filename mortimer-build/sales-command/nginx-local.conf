server {
    listen 3333;
    server_name _;
    
    root /root/.openclaw/workspace/mortimer-build/sales-command;
    index index.html;
    
    location / {
        try_files $uri $uri/ =404;
    }
    
    location /api/collections {
        proxy_pass https://psdepot.com/collections/api;
        proxy_set_header Host psdepot.com;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Access-Control-Allow-Origin *;
    }
    
    location /api/depotchaos {
        proxy_pass https://psdepot.com/depotchaos/api/stats;
        proxy_set_header Host psdepot.com;
        add_header Access-Control-Allow-Origin *;
    }
    
    location /api/psd {
        proxy_pass https://psdepot.com/psd-api/dashboard/overview;
        proxy_set_header Host psdepot.com;
        add_header Access-Control-Allow-Origin *;
    }
}