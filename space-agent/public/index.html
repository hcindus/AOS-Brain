<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miles Space Agent | AGI Company</title>
    <style>
        :root {
            --bg-dark: #0a0a1a;
            --neon-cyan: #00f3ff;
            --neon-purple: #8b5cf6;
            --neon-orange: #ff7a00;
            --text: #e5e5e5;
            --text-muted: #a0a0a0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }

        /* Header */
        .header {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 60px;
            background: rgba(10, 10, 26, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 243, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 100;
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brain-status {
            display: flex;
            gap: 15px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #22c55e;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Infinite Canvas */
        .canvas-container {
            position: fixed;
            top: 60px; left: 0; right: 0; bottom: 0;
            overflow: auto;
            background: 
                radial-gradient(circle at 20% 80%, rgba(0, 243, 255, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(139, 92, 246, 0.03) 0%, transparent 50%),
                var(--bg-dark);
        }

        .infinite-grid {
            min-width: 3000px;
            min-height: 3000px;
            position: relative;
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        /* Widget Base */
        .widget {
            position: absolute;
            background: rgba(20, 20, 40, 0.8);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 8px;
            backdrop-filter: blur(10px);
            min-width: 200px;
            min-height: 150px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            transition: box-shadow 0.3s;
        }

        .widget:hover {
            box-shadow: 0 4px 30px rgba(0, 243, 255, 0.1);
        }

        .widget-header {
            padding: 10px 15px;
            border-bottom: 1px solid rgba(0, 243, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: move;
        }

        .widget-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--neon-cyan);
        }

        .widget-close {
            width: 16px; height: 16px;
            background: rgba(255, 122, 0, 0.2);
            border: none;
            border-radius: 4px;
            color: var(--neon-orange);
            cursor: pointer;
            font-size: 10px;
        }

        .widget-content {
            padding: 15px;
        }

        /* Chat Widget */
        .chat-widget {
            width: 350px;
            height: 500px;
            display: flex;
            flex-direction: column;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            font-size: 13px;
            line-height: 1.5;
        }

        .chat-input {
            padding: 10px;
            border-top: 1px solid rgba(0, 243, 255, 0.1);
            display: flex;
            gap: 10px;
        }

        .chat-input input {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 4px;
            padding: 8px 12px;
            color: var(--text);
            font-size: 13px;
        }

        .chat-input button {
            background: var(--neon-cyan);
            color: var(--bg-dark);
            border: none;
            border-radius: 4px;
            padding: 8px 16px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Brain Status Widget */
        .brain-widget {
            width: 280px;
        }

        .brain-metric {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(0, 243, 255, 0.05);
            font-size: 12px;
        }

        .brain-metric:last-child {
            border-bottom: none;
        }

        .metric-value {
            color: var(--neon-cyan);
            font-family: 'JetBrains Mono', monospace;
        }

        /* Message bubble */
        .msg {
            margin-bottom: 10px;
            padding: 8px 12px;
            border-radius: 6px;
            max-width: 85%;
        }

        .msg-user {
            background: rgba(0, 243, 255, 0.1);
            margin-left: auto;
            border: 1px solid rgba(0, 243, 255, 0.2);
        }

        .msg-agent {
            background: rgba(139, 92, 246, 0.1);
            border: 1px solid rgba(139, 92, 246, 0.2);
        }

        .msg-system {
            background: rgba(255, 122, 0, 0.1);
            border: 1px solid rgba(255, 122, 0, 0.2);
            font-size: 11px;
            color: var(--text-muted);
        }

        /* Floating Action Button */
        .fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            border: none;
            border-radius: 50%;
            color: var(--bg-dark);
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 243, 255, 0.3);
            z-index: 90;
            transition: transform 0.2s;
        }

        .fab:hover {
            transform: scale(1.1);
        }

        /* Menu */
        .menu {
            position: fixed;
            bottom: 100px;
            right: 30px;
            background: rgba(20, 20, 40, 0.95);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 8px;
            padding: 10px 0;
            display: none;
            z-index: 89;
            min-width: 180px;
        }

        .menu.visible {
            display: block;
        }

        .menu-item {
            padding: 10px 20px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .menu-item:hover {
            background: rgba(0, 243, 255, 0.1);
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="logo">🚀 Miles Space Agent</div>
        <div class="brain-status">
            <div class="status-indicator">
                <div class="status-dot"></div>
                <span>Brain Connected</span>
            </div>
            <span id="brain-tick">Tick: --</span>
            <span id="brain-phase">Phase: --</span>
        </div>
    </div>

    <!-- Infinite Canvas -->
    <div class="canvas-container" id="canvas">
        <div class="infinite-grid" id="grid">
            <!-- Widgets will be dynamically created here -->
        </div>
    </div>

    <!-- Floating Action Button -->
    <button class="fab" id="fab">+</button>
    <div class="menu" id="menu">
        <div class="menu-item" onclick="createChatWidget()">💬 New Chat</div>
        <div class="menu-item" onclick="createBrainWidget()">🧠 Brain Status</div>
        <div class="menu-item" onclick="createWidgetWidget()">📊 Custom Widget</div>
        <div class="menu-item" onclick="clearCanvas()">🗑️ Clear All</div>
    </div>

    <!-- Scripts -->
    <script src="/src/space-agent.js"></script>
    <script>
        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            SpaceAgent.init();
            
            // Create initial widgets
            createChatWidget(100, 100);
            createBrainWidget(500, 100);
        });

        // Menu toggle
        const fab = document.getElementById('fab');
        const menu = document.getElementById('menu');
        fab.addEventListener('click', () => {
            menu.classList.toggle('visible');
        });

        // Widget creation functions
        function createChatWidget(x = 100, y = 100) {
            const widget = document.createElement('div');
            widget.className = 'widget chat-widget';
            widget.style.left = x + 'px';
            widget.style.top = y + 'px';
            widget.id = 'chat-' + Date.now();
            
            widget.innerHTML = `
                <div class="widget-header">
                    <span class="widget-title">💬 Agent Chat</span>
                    <button class="widget-close" onclick="this.parentElement.parentElement.remove()">×</button>
                </div>
                <div class="widget-content chat-messages" id="chat-history-${widget.id}">
                    <div class="msg msg-system">Connected to AOS Brain v4.5. Ask anything...</div>
                </div>
                <div class="chat-input">
                    <input type="text" id="input-${widget.id}" placeholder="Ask the agent..." 
                           onkeypress="if(event.key==='Enter')sendMessage('${widget.id}')">
                    <button onclick="sendMessage('${widget.id}')">Send</button>
                </div>
            `;
            
            document.getElementById('grid').appendChild(widget);
            makeDraggable(widget);
            return widget;
        }

        function createBrainWidget(x = 500, y = 100) {
            const widget = document.createElement('div');
            widget.className = 'widget brain-widget';
            widget.style.left = x + 'px';
            widget.style.top = y + 'px';
            widget.id = 'brain-' + Date.now();
            
            widget.innerHTML = `
                <div class="widget-header">
                    <span class="widget-title">🧠 Brain Status</span>
                    <button class="widget-close" onclick="this.parentElement.parentElement.remove()">×</button>
                </div>
                <div class="widget-content" id="brain-content-${widget.id}">
                    <div class="brain-metric">
                        <span>Tick</span>
                        <span class="metric-value" id="tick-${widget.id}">--</span>
                    </div>
                    <div class="brain-metric">
                        <span>Phase</span>
                        <span class="metric-value" id="phase-${widget.id}">--</span>
                    </div>
                    <div class="brain-metric">
                        <span>Signal Quality</span>
                        <span class="metric-value" id="signal-${widget.id}">--%</span>
                    </div>
                    <div class="brain-metric">
                        <span>Conscious</span>
                        <span class="metric-value" id="con-${widget.id}">--/10</span>
                    </div>
                    <div class="brain-metric">
                        <span>Subconscious</span>
                        <span class="metric-value" id="sub-${widget.id}">--/100</span>
                    </div>
                    <div class="brain-metric">
                        <span>Unconscious</span>
                        <span class="metric-value" id="uncon-${widget.id}">--/2000</span>
                    </div>
                </div>
            `;
            
            document.getElementById('grid').appendChild(widget);
            makeDraggable(widget);
            return widget;
        }

        function createWidgetWidget() {
            alert('Custom widget creation - Agent will generate code based on your request');
        }

        function clearCanvas() {
            document.getElementById('grid').innerHTML = '';
        }

        function sendMessage(widgetId) {
            const input = document.getElementById(`input-${widgetId}`);
            const history = document.getElementById(`chat-history-${widgetId}`);
            const message = input.value.trim();
            
            if (!message) return;
            
            // Add user message
            const userMsg = document.createElement('div');
            userMsg.className = 'msg msg-user';
            userMsg.textContent = message;
            history.appendChild(userMsg);
            
            // Clear input
            input.value = '';
            
            // Scroll to bottom
            history.scrollTop = history.scrollHeight;
            
            // Send to Space Agent
            SpaceAgent.send(message, widgetId);
        }

        function makeDraggable(element) {
            const header = element.querySelector('.widget-header');
            let isDragging = false;
            let currentX, currentY, initialX, initialY;
            let xOffset = parseInt(element.style.left) || 0;
            let yOffset = parseInt(element.style.top) || 0;

            header.addEventListener('mousedown', dragStart);
            document.addEventListener('mouseup', dragEnd);
            document.addEventListener('mousemove', drag);

            function dragStart(e) {
                initialX = e.clientX - xOffset;
                initialY = e.clientY - yOffset;
                if (e.target === header || e.target.closest('.widget-header')) {
                    isDragging = true;
                }
            }

            function dragEnd() {
                initialX = currentX;
                initialY = currentY;
                isDragging = false;
            }

            function drag(e) {
                if (isDragging) {
                    e.preventDefault();
                    currentX = e.clientX - initialX;
                    currentY = e.clientY - initialY;
                    xOffset = currentX;
                    yOffset = currentY;
                    element.style.left = currentX + 'px';
                    element.style.top = currentY + 'px';
                }
            }
        }
    </script>
</body>
</html>
