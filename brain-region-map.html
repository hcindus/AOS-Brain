<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brain Regions — 3D Vector Map</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#04040c; font-family:-apple-system,'Segoe UI',Roboto,sans-serif; }
  #canvas { display:block; }
  #hud { position:fixed; top:14px; left:14px; color:#9fb8d8; font-size:12px; pointer-events:none; z-index:10; line-height:1.5; }
  #hud h1 { font-size:15px; color:#e8f0ff; margin:0 0 2px; letter-spacing:.5px; }
  #hud .dim { color:#5b7290; font-size:10px; }
  #legend { position:fixed; bottom:14px; left:14px; color:#8aa3c4; font-size:10px; pointer-events:none; z-index:10; line-height:1.6; }
  #legend .o { color:#ffd740; } #legend .r { color:#ff5c5c; }
</style>
</head>
<body>
<div id="canvas"></div>
<div id="hud">
  <h1>🧠 Brain — Seven Regions</h1>
  <div class="dim">drag to orbit · scroll to zoom</div>
  <div class="dim" style="margin-top:6px">Observe → Orient → Decide → Act</div>
</div>
<div id="legend">
  <span class="o">●</span> light pulse = data traveling<br>
  <span class="r">●</span> node = brain region
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── Scene ──────────────────────────────────────────────
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x04040c, 0.008);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 200);
camera.position.set(14, 9, 18);

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.getElementById('canvas').appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 6;
controls.maxDistance = 60;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.4;

// ── Starfield ──────────────────────────────────────────
const stars = new THREE.BufferGeometry();
const starPos = [];
for (let i=0;i<600;i++){
  const r = 40 + Math.random()*80;
  const t = Math.random()*Math.PI*2, p = Math.acos(2*Math.random()-1);
  starPos.push(r*Math.sin(p)*Math.cos(t), r*Math.sin(p)*Math.sin(t), r*Math.cos(p));
}
stars.setAttribute('position', new THREE.Float32BufferAttribute(starPos,3));
const starMat = new THREE.PointsMaterial({ color:0x4a5f80, size:0.12, sizeAttenuation:true, transparent:true, opacity:0.7 });
scene.add(new THREE.Points(stars, starMat));

// ── Regions ─────────────────────────────────────────────
// name, position, color, group (Observe/Orient/Decide/Act)
const REGIONS = [
  { name:'Visual Cortex',   pos:[ -6.5, 3.5, -5 ], color:0x4fc3f7, group:'Observe' },
  { name:'Thalamus',        pos:[  0, 1.5,  0 ], color:0x29b6f6, group:'Observe' },
  { name:'Hippocampus',     pos:[ -5, -2,  2 ], color:0x7e57c2, group:'Orient'  },
  { name:'Amygdala',        pos:[  5, -2,  2 ], color:0xef5350, group:'Orient'  },
  { name:'Prefrontal Cortex', pos:[ 0, 4,  6 ], color:0xffd740, group:'Decide'  },
  { name:'Basal Ganglia',   pos:[  0, -4.5, 0 ], color:0x66bb6a, group:'Act'     },
  { name:'Cerebellum',      pos:[  2.5, -3, -6 ], color:0x26a69a, group:'Act'     },
];

const groupColors = { Observe:0x4fc3f7, Orient:0x9c6ade, Decide:0xffd740, Act:0x66bb6a };

// connections (index pairs) — the OODA cycle + cross-links
const EDGES = [
  [0,1], // Visual Cortex -> Thalamus
  [1,2], // Thalamus -> Hippocampus
  [1,3], // Thalamus -> Amygdala
  [2,4], // Hippocampus -> PFC
  [3,4], // Amygdala -> PFC
  [4,5], // PFC -> Basal Ganglia
  [5,6], // Basal Ganglia -> Cerebellum
  [6,1], // Cerebellum -> Thalamus (feedback loop)
  [2,6], // Hippocampus -> Cerebellum (memory->motor)
  [3,5], // Amygdala -> Basal Ganglia (emotional->action)
];

// node meshes
const nodes = REGIONS.map((r,i) => {
  const geo = new THREE.SphereGeometry(0.55, 32, 32);
  const mat = new THREE.MeshStandardMaterial({ color:r.color, emissive:r.color, emissiveIntensity:0.55, roughness:0.25, metalness:0.1 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(...r.pos);
  mesh.userData = r;
  scene.add(mesh);

  // halo
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTexture(r.color), transparent:true, opacity:0.5, depthWrite:false
  }));
  halo.scale.set(3.5,3.5,1);
  mesh.add(halo);

  // label
  const label = makeLabel(r.name);
  label.position.set(0, 1.2, 0);
  mesh.add(label);

  return mesh;
});

// ── Thin connection lines ──────────────────────────────
const lineMat = new THREE.LineBasicMaterial({ color:0x2a4a6a, transparent:true, opacity:0.55 });
const lines = EDGES.map(([a,b]) => {
  const geo = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(...REGIONS[a].pos),
    new THREE.Vector3(...REGIONS[b].pos),
  ]);
  const line = new THREE.Line(geo, lineMat);
  scene.add(line);
  return { a, b, start:new THREE.Vector3(...REGIONS[a].pos), end:new THREE.Vector3(...REGIONS[b].pos) };
});

// ── Light pulses (data traffic) ────────────────────────
const pulseGeo = new THREE.SphereGeometry(0.13, 12, 12);
const pulses = [];
lines.forEach((edge, ei) => {
  const n = 2 + (ei % 2);  // 2-3 pulses per edge
  for (let j=0;j<n;j++){
    const mat = new THREE.MeshBasicMaterial({ color:0xffe082, transparent:true, opacity:0.9 });
    const m = new THREE.Mesh(pulseGeo, mat);
    m.visible = true;
    scene.add(m);
    pulses.push({ mesh:m, start:edge.start.clone(), end:edge.end.clone(),
                  t:(j/n) + Math.random()*0.1, speed:0.12 + Math.random()*0.1, edge:ei });
  }
});

// ── Lighting ────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x304060, 1.4));
const key = new THREE.DirectionalLight(0xffffff, 1.2); key.position.set(10,15,10); scene.add(key);
const rim = new THREE.PointLight(0x4fc3f7, 30, 60); rim.position.set(-10,5,-10); scene.add(rim);

// ── Helpers ─────────────────────────────────────────────
function glowTexture(color){
  const c = document.createElement('canvas'); c.width=c.height=128;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(64,64,0,64,64,64);
  grad.addColorStop(0, '#'+color.toString(16).padStart(6,'0'));
  grad.addColorStop(1, 'transparent');
  g.fillStyle = grad; g.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
}
function makeLabel(text){
  const c = document.createElement('canvas'); c.width=512; c.height=96;
  const g = c.getContext('2d');
  g.font = '600 40px "Segoe UI", sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.shadowColor = 'rgba(0,0,0,.9)'; g.shadowBlur = 8;
  g.fillStyle = '#e8f0ff';
  g.fillText(text, 256, 48);
  const tex = new THREE.CanvasTexture(c);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map:tex, transparent:true, depthWrite:false }));
  sprite.scale.set(4.2, 0.79, 1);
  return sprite;
}

// ── Animation ───────────────────────────────────────────
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  // advance pulses along edges
  pulses.forEach(p => {
    p.t += p.speed * dt;
    if (p.t > 1) p.t = 0;
    p.mesh.position.lerpVectors(p.start, p.end, p.t);
    // fade near ends
    const fade = Math.sin(p.t * Math.PI);
    p.mesh.material.opacity = 0.2 + 0.8 * fade;
    p.mesh.scale.setScalar(0.7 + 0.6 * fade);
  });

  // subtle node pulse
  nodes.forEach((n, i) => {
    const s = 1 + Math.sin(clock.elapsedTime*2 + i)*0.06;
    n.scale.setScalar(s);
  });

  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
