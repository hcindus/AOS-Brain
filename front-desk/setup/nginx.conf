# Frontline SOA — nginx site (drop into /etc/nginx/sites-available/)
# Proxies https://psdepot.com/frontline -> 127.0.0.1:8120
# NOTE: use ^~ so it wins over any `location ~* \.(css|js|...)$` static-cache block.

location = /frontline { return 301 /frontline/; }
location ^~ /frontline/ {
    proxy_pass http://127.0.0.1:8120/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}
