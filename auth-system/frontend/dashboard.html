<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Secure Login</title>
    <link rel="stylesheet" href="assets/auth.css">
</head>
<body>
    <div class="dashboard">
        <div class="auth-card">
            <div class="dashboard-header">
                <div>
                    <h1>👤 Account Dashboard</h1>
                    <p class="subtitle" id="user-email">Loading...</p>
                </div>
                <button class="btn btn-secondary" onclick="logout()" style="width: auto; padding: 12px 24px;">
                    Logout
                </button>
            </div>

            <div class="dashboard-card">
                <h3>🔐 Security Settings</h3>
                <div class="user-info">
                    <div class="user-info-row">
                        <span class="user-info-label">Email</span>
                        <span class="user-info-value" id="security-email">-</span>
                    </div>
                    <div class="user-info-row">
                        <span class="user-info-label">Multi-Factor Authentication</span>
                        <span class="user-info-value">
                            <span id="mfa-status-badge"></span>
                        </span>
                    </div>
                    <div class="user-info-row">
                        <span class="user-info-label">Account Created</span>
                        <span class="user-info-value" id="created-at">-</span>
                    </div>
                </div>
                
                <div id="mfa-section" class="mt-20">
                    <!-- MFA setup button or QR code will appear here -->
                </div>
            </div>

            <div class="dashboard-card">
                <h3>📊 Recent Activity</h3>
                <div id="activity-log">
                    <p class="text-muted">Loading activity log...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/auth.js"></script>
    <script>
        // Load user data
        async function loadUserData() {
            const user = AuthAPI.getCurrentUser();
            if (!user) {
                window.location.href = '/index.html';
                return;
            }

            document.getElementById('user-email').textContent = user.email;
            document.getElementById('security-email').textContent = user.email;
            
            // Update MFA status
            const mfaBadge = document.getElementById('mfa-status-badge');
            const mfaSection = document.getElementById('mfa-section');
            
            if (user.mfaEnabled) {
                mfaBadge.innerHTML = '<span class="badge badge-enabled">✓ Enabled</span>';
                mfaSection.innerHTML = `
                    <p style="color: var(--success)">🔒 Your account is protected with MFA</p>
                `;
            } else {
                mfaBadge.innerHTML = '<span class="badge badge-disabled">Disabled</span>';
                mfaSection.innerHTML = `
                    <div class="alert alert-warning">
                        <p>⚠️ MFA is not enabled. Enable it for additional security.</p>
                        <button class="btn btn-primary" onclick="setupMFA()" style="margin-top: 12px;">
                            Enable MFA
                        </button>
                    </div>
                `;
            }

            // Format creation date
            if (user.created_at) {
                const date = new Date(user.created_at);
                document.getElementById('created-at').textContent = date.toLocaleDateString();
            }
        }

        // Setup MFA
        async function setupMFA() {
            try {
                const result = await AuthAPI.setupMFA();
                
                if (result.success) {
                    const mfaSection = document.getElementById('mfa-section');
                    mfaSection.innerHTML = `
                        <div class="text-center">
                            <h4>Scan this QR code with your authenticator app</h4>
                            <div class="mfa-qr">
                                <img src="${result.qrCode}" alt="MFA QR Code">
                            </div>
                            <p class="help-text">Manual entry code:</p>
                            <div class="mfa-secret">${result.secret}</div>
                            
                            <div class="form-group" style="margin-top: 24px;">
                                <label>Enter verification code</label>
                                <input type="text" id="mfa-verify-code" maxlength="6" 
                                       placeholder="000000" style="text-align: center; font-size: 20px;">
                            </div>
                            
                            <button class="btn btn-primary" onclick="verifyMFA()">
                                Verify & Enable MFA
                            </button>
                        </div>
                    `;
                }
            } catch (err) {
                alert('Failed to setup MFA: ' + err.message);
            }
        }

        // Verify MFA
        async function verifyMFA() {
            const code = document.getElementById('mfa-verify-code').value;
            
            try {
                const result = await AuthAPI.verifyMFA(code);
                
                if (result.success) {
                    alert('MFA enabled successfully!');
                    window.location.reload();
                } else {
                    alert(result.error || 'Verification failed');
                }
            } catch (err) {
                alert('Verification failed: ' + err.message);
            }
        }

        // Load on page ready
        document.addEventListener('DOMContentLoaded', loadUserData);
    </script>
</body>
</html>
