<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PATRICIA - Production Assessment Agent | Tappylewis & Myl0nR0s</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --patricia-cyan: #00d4ff;
            --patricia-purple: #6b4ee6;
            --patricia-pink: #ff6b9d;
            --patricia-orange: #ff9f43;
            --patricia-dark: #0d0d1a;
            --patricia-glass: rgba(13, 13, 26, 0.9);
            --assessor-gold: #ffd700;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--patricia-dark);
            color: white;
            overflow: hidden;
            height: 100vh;
        }
        
        #factory-floor {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        #control-room {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }
        
        .patricia-core {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: auto;
            width: 600px;
            max-height: 80vh;
        }
        
        .patricia-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, var(--patricia-cyan), var(--patricia-purple));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            box-shadow: 0 0 60px var(--patricia-cyan), 0 0 100px var(--patricia-purple);
            animation: patricia-pulse 3s ease-in-out infinite;
            position: relative;
        }
        
        .patricia-avatar::before {
            content: '';
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            border: 2px solid var(--assessor-gold);
            opacity: 0.5;
            animation: rotate-ring 10s linear infinite;
        }
        
        @keyframes patricia-pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 60px var(--patricia-cyan); }
            50% { transform: scale(1.05); box-shadow: 0 0 80px var(--patricia-cyan), 0 0 120px var(--patricia-purple); }
        }
        
        @keyframes rotate-ring {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .patricia-card {
            background: var(--patricia-glass);
            border: 1px solid var(--patricia-cyan);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(20px);
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.2);
        }
        
        .patricia-header {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(0, 212, 255, 0.3);
        }
        
        .patricia-header h1 {
            font-size: 28px;
            color: var(--patricia-cyan);
            margin-bottom: 8px;
            letter-spacing: 3px;
        }
        
        .patricia-header .subtitle {
            font-size: 14px;
            color: var(--assessor-gold);
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .patricia-status {
            display: flex;
            justify-content: space-around;
            margin-bottom: 25px;
            padding: 15px;
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
        }
        
        .status-item {
            text-align: center;
        }
        
        .status-value {
            font-size: 24px;
            font-weight: bold;
            color: var(--patricia-cyan);
        }
        
        .status-label {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
        }
        
        .chat-window {
            height: 300px;
            overflow-y: auto;
            background: rgba(0,0,0,0.4);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 212, 255, 0.2);
        }
        
        .chat-message {
            margin-bottom: 12px;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            max-width: 90%;
        }
        
        .chat-message.patricia {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.15), rgba(107, 78, 230, 0.15));
            margin-right: auto;
            border-left: 3px solid var(--patricia-cyan);
        }
        
        .chat-message.user {
            background: rgba(255, 255, 255, 0.1);
            margin-left: auto;
            text-align: right;
        }
        
        .chat-message.system {
            background: rgba(255, 215, 0, 0.1);
            border-left: 3px solid var(--assessor-gold);
            font-size: 12px;
            color: #aaa;
        }
        
        .input-area {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .input-area input {
            flex: 1;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 12px;
            padding: 14px 20px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
        }
        
        .input-area input:focus {
            border-color: var(--patricia-cyan);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }
        
        .input-area input::placeholder {
            color: #666;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--patricia-cyan), var(--patricia-purple));
            border: none;
            border-radius: 12px;
            padding: 14px 30px;
            color: white;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.4);
        }
        
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        
        .tool-btn {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 12px 8px;
            color: white;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }
        
        .tool-btn:hover {
            background: var(--patricia-purple);
            border-color: var(--patricia-purple);
            transform: translateY(-3px);
        }
        
        .tool-btn .icon {
            display: block;
            font-size: 24px;
            margin-bottom: 5px;
        }
        
        .tool-btn .label {
            font-size: 11px;
            opacity: 0.9;
        }
        
        .brain-status-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 280px;
            background: var(--patricia-glass);
            border: 1px solid var(--patricia-purple);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(15px);
            pointer-events: auto;
        }
        
        .panel-header {
            font-size: 16px;
            color: var(--patricia-purple);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .brain-metric {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 13px;
        }
        
        .brain-metric .value {
            color: var(--patricia-cyan);
            font-weight: bold;
        }
        
        .progress-bar {
            height: 4px;
            background: rgba(0,0,0,0.5);
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--patricia-cyan), var(--patricia-purple));
            border-radius: 2px;
            transition: width 0.5s ease;
        }
        
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--patricia-dark);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--patricia-cyan);
        }
        
        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 3px solid transparent;
            border-top-color: var(--patricia-cyan);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .six-sigma-badge {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: linear-gradient(135deg, var(--assessor-gold), #ff9500);
            color: black;
            padding: 15px 25px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 14px;
            pointer-events: auto;
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.3);
        }
    </style>
</head>
<body>
    <div id="loading-overlay" class="loading-overlay">
        <div class="loading-spinner"></div>
        <div style="font-size: 20px; margin-bottom: 10px;">🔍 Initializing PATRICIA</div>
        <div style="font-size: 14px; color: #888;">Production Assessment & Quality Control Agent</div>
        <div id="init-status" style="margin-top: 20px; font-size: 12px; color: var(--patricia-cyan);">Loading personality modules...</div>
    </div>

    <canvas id="factory-floor"></canvas>
    
    <div id="control-room">
        <div class="patricia-core">
            <div class="patricia-avatar">🔍</div>
            
            <div class="patricia-card">
                <div class="patricia-header">
                    <h1>PATRICIA</h1>
                    <div class="subtitle">Production Assessment & Tracking Intelligence</div>
                </div>
                
                <div class="patricia-status">
                    <div class="status-item">
                        <div class="status-value" id="queue-count">--</div>
                        <div class="status-label">Queue</div>
                    </div>
                    <div class="status-item">
                        <div class="status-value" id="defect-count">--</div>
                        <div class="status-label">Defects</div>
                    </div>
                    <div class="status-item">
                        <div class="status-value" id="sigma-level">--σ</div>
                        <div class="status-label">Sigma</div>
                    </div>
                </div>
                
                <div class="chat-window" id="chat-window">
                    <!-- Chat messages appear here -->
                </div>
                
                <div class="input-area">
                    <input type="text" id="patricia-input" 
                           placeholder="Ask me to assess production, check brain status, navigate, analyze..."
                           onkeydown="if(event.key==='Enter')sendToPatricia()">
                    <button class="btn-primary" onclick="sendToPatricia()">Send</button>
                </div>
                
                <div class="tools-grid">
                    <button class="tool-btn" onclick="patriciaTool('assess')">
                        <span class="icon">📊</span>
                        <span class="label">Assess</span>
                    </button>
                    <button class="tool-btn" onclick="patriciaTool('defects')">
                        <span class="icon">⚠️</span>
                        <span class="label">Defects</span>
                    </button>
                    <button class="tool-btn" onclick="patriciaTool('brain')">
                        <span class="icon">🧠</span>
                        <span class="label">Brain</span>
                    </button>
                    <button class="tool-btn" onclick="patriciaTool('navigate')">
                        <span class="icon">🌐</span>
                        <span class="label">Navigate</span>
                    </button>
                    
                    <button class="tool-btn" onclick="patriciaTool('search')">
                        <span class="icon">🔍</span>
                        <span class="label">Search</span>
                    </button>
                    <button class="tool-btn" onclick="patriciaTool('extract')">
                        <span class="icon">📋</span>
                        <span class="label">Extract</span>
                    </button>
                    <button class="tool-btn" onclick="patriciaTool('screenshot')">
                        <span class="icon">📸</span>
                        <span class="label">Capture</span>
                    </button>
                    <button class="tool-btn" onclick="patriciaTool('report')">
                        <span class="icon">📈</span>
                        <span class="label">Report</span>
                    </button>
                </div>
            </div>
        </div>
        
        <div class="brain-status-panel">
            <div class="panel-header">
                🧠 Brain Link
            </div>
            <div class="brain-metric">
                <span>Tick:</span>
                <span class="value" id="brain-tick">--</span>
            </div>
            <div class="brain-metric">
                <span>Phase:</span>
                <span class="value" id="brain-phase">--</span>
            </div>
            <div class="brain-metric">
                <span>Signal:</span>
                <span class="value" id="brain-signal">--%</span>
            </div>
            <div class="brain-metric">
                <span>Unconscious:</span>
                <span class="value" id="brain-unconscious">--/2000</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="unconscious-bar" style="width: 0%;"></div>
            </div>
        </div>
        
        <div class="six-sigma-badge">
            ⭐ Six Sigma Assessor
        </div>
    </div>

    <script src="space-universe.js"></script>
    <script src="personalities.js"></script>
    <script src="tools.js"></script>
    <script src="patricia.js"></script>
    <script src="patricia-app.js">></script>
</body>
</html>
