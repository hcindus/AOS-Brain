<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Um or Uh? — Drinking Game</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #1a1d24;
    --border: #2a2f3a;
    --um: #ffb347;
    --uh: #5c9eff;
    --text: #e6e8ee;
    --muted: #8a90a0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    padding: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 { font-size: 2rem; letter-spacing: -0.02em; margin-bottom: 4px; }
  .subtitle { color: var(--muted); margin-bottom: 24px; }

  .layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    width: 100%;
    max-width: 900px;
  }

  .team {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
  }
  .team.um { border-top: 4px solid var(--um); }
  .team.uh { border-top: 4px solid var(--uh); }

  .team-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .team-name { font-size: 1.4rem; font-weight: 700; }
  .team.um .team-name { color: var(--um); }
  .team.uh .team-name { color: var(--uh); }
  .keyword-badge {
    font-size: 0.85rem;
    padding: 4px 10px;
    border-radius: 20px;
    font-weight: 600;
  }
  .team.um .keyword-badge { background: rgba(255,179,71,0.15); color: var(--um); }
  .team.uh .keyword-badge { background: rgba(92,158,255,0.15); color: var(--uh); }

  .score-big { font-size: 3rem; font-weight: 800; text-align: center; margin: 8px 0; }
  .team.um .score-big { color: var(--um); }
  .team.uh .score-big { color: var(--uh); }

  .players { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .player {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    border-radius: 10px;
    background: rgba(255,255,255,0.03);
    border: 1px solid transparent;
  }
  .player.current { border-color: #fff; background: rgba(255,255,255,0.08); }
  .player .pname { font-weight: 600; }
  .player .pshots { color: var(--muted); font-variant-numeric: tabular-nums; }
  .player .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); margin-right: 8px; }
  .player.current .dot { background: #3ddc84; box-shadow: 0 0 8px #3ddc84; }

  .controls {
    grid-column: 1 / -1;
    display: flex;
    gap: 12px;
    align-items: center;
    justify-content: center;
    margin-top: 8px;
    flex-wrap: wrap;
  }
  button {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 1rem;
    cursor: pointer;
    font-weight: 600;
    transition: 0.15s;
  }
  button:hover { border-color: #fff; }
  button.primary { background: #3ddc84; color: #0f1115; border-color: #3ddc84; }
  button.primary:hover { filter: brightness(1.1); }

  .current-word {
    grid-column: 1 / -1;
    text-align: center;
    padding: 24px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
  }
  .current-word .label { color: var(--muted); font-size: 0.9rem; }
  .current-word .word {
    font-size: 4rem;
    font-weight: 800;
    margin: 8px 0;
    text-transform: uppercase;
  }
  .current-word .word.um { color: var(--um); }
  .current-word .word.uh { color: var(--uh); }
  .current-word .drinker { color: var(--muted); font-size: 1.1rem; }

  .setup {
    width: 100%;
    max-width: 900px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .setup h2 { margin-bottom: 12px; font-size: 1.1rem; }
  .setup textarea {
    width: 100%;
    height: 140px;
    background: #0a0c10;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    font-family: inherit;
    font-size: 0.9rem;
    resize: vertical;
  }
  .setup .row { display: flex; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
  .setup input {
    background: #0a0c10;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 0.9rem;
    flex: 1;
    min-width: 140px;
  }
  .setup label { font-size: 0.8rem; color: var(--muted); display: block; margin-bottom: 4px; }
  .field { flex: 1; min-width: 180px; }

  .winner-banner {
    grid-column: 1 / -1;
    text-align: center;
    font-size: 1.3rem;
    font-weight: 700;
    padding: 12px;
    border-radius: 12px;
    display: none;
  }
</style>
</head>
<body>
  <h1>🍻 Um or Uh?</h1>
  <div class="subtitle">Two teams, two lines. Drink on your keyword, rotate to the back.</div>

  <div class="setup" id="setupPanel">
    <h2>Setup</h2>
    <div class="row">
      <div class="field">
        <label>Team "um" players (comma-separated)</label>
        <input id="teamA" value="Alice, Ben, Cara, Dan">
      </div>
      <div class="field">
        <label>Team "uh" players (comma-separated)</label>
        <input id="teamB" value="Wendy, Xavier, Yara, Zed">
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>Paste a transcript (um/uh will be auto-detected)</label>
        <textarea id="transcript" placeholder="Paste any text containing 'um' and 'uh'..."></textarea>
      </div>
    </div>
    <div class="row">
      <button class="primary" id="startBtn">🎬 Load &amp; Play</button>
      <button id="demoBtn">Load Tariq Day demo</button>
    </div>
  </div>

  <div class="layout" id="gameArea" style="display:none;">
    <div class="team um">
      <div class="team-header">
        <span class="team-name">Team UM</span>
        <span class="keyword-badge">drink on "um"</span>
      </div>
      <div class="score-big" id="scoreA">0</div>
      <div class="players" id="playersA"></div>
    </div>

    <div class="team uh">
      <div class="team-header">
        <span class="team-name">Team UH</span>
        <span class="keyword-badge">drink on "uh"</span>
      </div>
      <div class="score-big" id="scoreB">0</div>
      <div class="players" id="playersB"></div>
    </div>

    <div class="current-word">
      <div class="label">Next up</div>
      <div class="word" id="wordDisplay">—</div>
      <div class="drinker" id="drinkerDisplay">Press play to begin</div>
    </div>

    <div class="winner-banner" id="winnerBanner"></div>

    <div class="controls">
      <button class="primary" id="playBtn">▶ Play</button>
      <button id="pauseBtn">⏸ Pause</button>
      <button id="resetBtn">↺ Reset</button>
      <button id="setupBtn">⚙ Setup</button>
    </div>
  </div>

<script>
  const state = {
    teamA: [], teamB: [],
    aIdx: 0, bIdx: 0,
    aShots: {}, bShots: {},
    totalA: 0, totalB: 0,
    tokens: [], // array of {type:'um'|'uh', context}
    pos: 0,
    playing: false,
    timer: null
  };

  const $ = id => document.getElementById(id);

  function parsePlayers(str) {
    return str.split(',').map(s => s.trim()).filter(Boolean);
  }

  function buildTeams() {
    state.teamA = parsePlayers($('teamA').value) || ['A1'];
    state.teamB = parsePlayers($('teamB').value) || ['B1'];
    state.aShots = Object.fromEntries(state.teamA.map(p => [p, 0]));
    state.bShots = Object.fromEntries(state.teamB.map(p => [p, 0]));
  }

  function tokenize(text) {
    const out = [];
    const re = /\b(um|uh)\b/gi;
    let m;
    while ((m = re.exec(text)) !== null) {
      const start = Math.max(0, m.index - 40);
      const end = Math.min(text.length, m.index + m[0].length + 40);
      out.push({ type: m[1].toLowerCase(), context: text.slice(start, end).replace(/\s+/g, ' ') });
    }
    return out;
  }

  function renderPlayers() {
    const aEl = $('playersA'), bEl = $('playersB');
    aEl.innerHTML = state.teamA.map((p, i) => `
      <div class="player ${i === state.aIdx ? 'current' : ''}">
        <span class="dot"></span><span class="pname">${p}</span><span class="pshots">${state.aShots[p]} shots</span>
      </div>`).join('');
    bEl.innerHTML = state.teamB.map((p, i) => `
      <div class="player ${i === state.bIdx ? 'current' : ''}">
        <span class="dot"></span><span class="pname">${p}</span><span class="pshots">${state.bShots[p]} shots</span>
      </div>`).join('');
    $('scoreA').textContent = state.totalA;
    $('scoreB').textContent = state.totalB;
  }

  function renderNext() {
    if (state.pos >= state.tokens.length) {
      $('wordDisplay').textContent = 'DONE';
      $('wordDisplay').className = 'word';
      $('drinkerDisplay').textContent = 'All hits consumed. Reset to replay.';
      showWinner();
      return;
    }
    const tok = state.tokens[state.pos];
    $('wordDisplay').textContent = tok.type;
    $('wordDisplay').className = 'word ' + tok.type;
    const drinker = tok.type === 'um' ? state.teamA[state.aIdx] : state.teamB[state.bIdx];
    $('drinkerDisplay').textContent = `${drinker} drinks!  ·  "${tok.context}"`;
  }

  function step() {
    if (state.pos >= state.tokens.length) { state.playing = false; return; }
    const tok = state.tokens[state.pos];
    if (tok.type === 'um') {
      const p = state.teamA[state.aIdx];
      state.aShots[p]++; state.totalA++;
      state.aIdx = (state.aIdx + 1) % state.teamA.length;
    } else {
      const p = state.teamB[state.bIdx];
      state.bShots[p]++; state.totalB++;
      state.bIdx = (state.bIdx + 1) % state.teamB.length;
    }
    state.pos++;
    renderPlayers();
    renderNext();
  }

  function showWinner() {
    const b = $('winnerBanner');
    b.style.display = 'block';
    if (state.totalA === state.totalB) b.textContent = '🤝 It\'s a tie! Everyone drinks.';
    else if (state.totalA < state.totalB) b.textContent = '🏆 Team UM is soberest! Team UH must finish a round.';
    else b.textContent = '🏆 Team UH is soberest! Team UM must finish a round.';
  }

  function start(text) {
    buildTeams();
    state.tokens = tokenize(text);
    state.pos = 0;
    state.totalA = state.totalB = 0;
    state.aIdx = state.bIdx = 0;
    state.teamA.forEach(p => state.aShots[p] = 0);
    state.teamB.forEach(p => state.bShots[p] = 0);
    $('setupPanel').style.display = 'none';
    $('gameArea').style.display = 'grid';
    $('winnerBanner').style.display = 'none';
    renderPlayers();
    renderNext();
  }

  $('startBtn').addEventListener('click', () => start($('transcript').value || prompt('No transcript — playing with empty. Paste text!')));
  $('demoBtn').addEventListener('click', () => {
    $('transcript').value = DEMO;
    start(DEMO);
  });
  $('playBtn').addEventListener('click', () => {
    if (state.pos >= state.tokens.length) return;
    state.playing = true;
    clearInterval(state.timer);
    state.timer = setInterval(() => {
      if (!state.playing) { clearInterval(state.timer); return; }
      step();
      if (state.pos >= state.tokens.length) clearInterval(state.timer);
    }, 1200);
  });
  $('pauseBtn').addEventListener('click', () => { state.playing = false; clearInterval(state.timer); });
  $('resetBtn').addEventListener('click', () => start(state.tokens.map(t => t.type).join(' ') === '' ? '' : $('transcript').value));
  $('setupBtn').addEventListener('click', () => {
    state.playing = false; clearInterval(state.timer);
    $('gameArea').style.display = 'none';
    $('setupPanel').style.display = 'block';
  });

  const DEMO = `Um, as I stated, um, I will affirm to, uh, with you to take an oath. Yes. But I'm not a United States citizen, so I don't uh I don't raise my hand. Um uh this from building official. Uh and it states notice is hereby. Um that Country Meadows has not held up uh their end of the contract and has been in constant violation. Uh I've issued what um we are expecting to take place. Um well, firstly, um in regards to um the uh my statement. Uh but there have been a handful of instances. Um, and the most recent time they cleaned. Uh her throat will begin to uh seize up. Um so as I stated. Uh the citation. Um yes. Uh for what is this for?`;
</script>
</body>
</html>
